<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{
  --bg:#f5f1e8; --card:#fffdf8; --ink:#1f1d1a; --sub:#6f6a60; --line:#e4ddcd;
  --fire:#e8743b; --fire2:#f3a35b; --moss:#4f6b4a; --gold:#d9a52b; --red:#c1272d;
  --r:18px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
  font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
body{display:flex;flex-direction:column;height:100dvh;overflow:hidden}
button{font:inherit;cursor:pointer}
input,textarea,select{font:inherit;color:inherit}
.hidden{display:none!important}

/* header */
header{display:flex;align-items:center;gap:10px;padding:12px 16px calc(10px);padding-top:max(12px,env(safe-area-inset-top));
  background:var(--card);border-bottom:1px solid var(--line);flex:none}
.brand{display:flex;flex-direction:column;line-height:1.1;flex:1;min-width:0}
.brand b{font-size:21px;letter-spacing:-.3px;font-weight:800;font-family:Georgia,"Times New Roman",serif;font-style:italic;color:#103827}
.brand b i{font-style:normal;color:var(--fire)}
.brand span{font-size:11.5px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;padding:6px 10px;border-radius:999px;background:var(--bg);border:1px solid var(--line);white-space:nowrap}
.chip.me{background:var(--ink);color:#fff;border-color:var(--ink)}
.dot{width:7px;height:7px;border-radius:50%;background:#3bb36a}
.demo-banner{flex:none;background:#fff4d6;color:#6b5210;font-size:12px;padding:7px 14px;border-bottom:1px solid #f0e0a8;line-height:1.45}

main{flex:1;min-height:0;position:relative}
.panel{position:absolute;inset:0;overflow:auto;padding:16px;padding-bottom:24px}
.panel.chatp{display:flex;flex-direction:column;padding:0}

/* tabs */
nav.tabs{flex:none;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav.tabs button{flex:1;border:0;background:none;padding:10px 4px 9px;font-size:12px;color:var(--sub);display:flex;flex-direction:column;align-items:center;gap:2px;position:relative}
nav.tabs button .ic{font-size:20px;line-height:1}
nav.tabs button.on{color:var(--ink);font-weight:700}
nav.tabs button.on::after{content:"";position:absolute;top:0;left:30%;right:30%;height:3px;border-radius:0 0 3px 3px;background:var(--fire)}
.badge{position:absolute;top:5px;left:calc(50% + 6px);background:var(--red);color:#fff;font-size:10.5px;min-width:17px;height:17px;border-radius:9px;padding:0 5px;display:flex;align-items:center;justify-content:center;font-weight:700}

/* cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:14px}
.card h3{margin:0 0 12px;font-size:16px}
.muted{color:var(--sub);font-size:13px;line-height:1.5}
.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:700;background:var(--ink);color:#fff;font-size:15px}
.btn.fire{background:var(--fire)}
.btn.ghost{background:var(--bg);color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:#fff;color:var(--red);border:1px solid #efc6c6}
.btn.sm{padding:8px 12px;font-size:13px;border-radius:10px}
.btn:disabled{opacity:.45}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.field label{font-size:12.5px;color:var(--sub);font-weight:600}
.inp{width:100%;border:1px solid var(--line);background:#fff;border-radius:12px;padding:12px 14px;font-size:16px;outline:none}
.inp:focus{border-color:var(--ink)}
textarea.inp{min-height:140px;font-size:14px;line-height:1.5;resize:vertical}
.check{display:flex;align-items:center;gap:8px;font-size:14px;margin:6px 0}
.check input{width:18px;height:18px;accent-color:var(--fire)}

/* login */
.login{flex:1;display:flex;align-items:center;justify-content:center;padding:24px;overflow:auto}
.login .box{width:100%;max-width:380px;text-align:center}
.logo-mark{margin:0 auto 10px;display:flex;justify-content:center}
.logo-mark img{width:min(240px,64vw);height:auto;display:block}
.logo-mark.sm img{width:min(170px,46vw)}
.brand-wrap{display:flex;align-items:center;gap:8px;flex:1;min-width:0}
.brand-wrap img{height:34px;width:auto;flex:none}
.idle-logo{width:min(230px,62vw);height:auto;display:block;margin:0 auto 4px;animation:bob 3.5s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.login h1{font-size:28px;margin:0 0 4px;letter-spacing:-.8px}
.login h1 i{font-style:normal;color:var(--fire)}
.login p{margin:0 0 22px}
.login .inp{text-align:center;font-size:20px;letter-spacing:1px;padding:15px}
.login .btn{width:100%;margin-top:10px;padding:15px;font-size:16px}
.err{color:var(--red);font-size:13px;min-height:20px;margin-top:10px}

/* stage: idle */
.idle{text-align:center;padding:26px 18px}
.ticket{display:inline-flex;flex-direction:column;align-items:center;background:var(--ink);color:#fff;border-radius:20px;padding:16px 30px;margin:16px 0 6px;position:relative}
.ticket small{font-size:11px;letter-spacing:2px;opacity:.7}
.ticket b{font-size:46px;line-height:1.05;font-weight:800}
.ticket::before,.ticket::after{content:"";position:absolute;top:50%;width:16px;height:16px;border-radius:50%;background:var(--card);transform:translateY(-50%)}
.ticket::before{left:-8px}.ticket::after{right:-8px}
.idle .msg{font-size:17px;font-weight:700;margin:16px 0 6px;white-space:pre-wrap}
.fire-anim{font-size:54px;display:inline-block;animation:flick 1.6s ease-in-out infinite}
@keyframes flick{0%,100%{transform:scale(1) rotate(-2deg)}50%{transform:scale(1.08) rotate(2deg)}}

/* stage: draw */
.draw{text-align:center}
.prize-label{display:inline-block;background:var(--fire);color:#fff;font-weight:800;padding:8px 16px;border-radius:999px;font-size:15px;margin-bottom:14px}
.slot{background:var(--ink);color:#fff;border-radius:24px;padding:26px 12px;position:relative;overflow:hidden;min-height:170px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.slot::before{content:"";position:absolute;inset:8px;border:1.5px dashed rgba(255,255,255,.18);border-radius:18px;pointer-events:none}
.slot-no{font-size:64px;font-weight:900;line-height:1;letter-spacing:-2px;font-variant-numeric:tabular-nums}
.slot-name{font-size:22px;font-weight:700;margin-top:8px;min-height:28px}
.slot.rolling .slot-no{opacity:.85}
.slot.win{background:linear-gradient(135deg,var(--fire),var(--gold))}
.slot.win .slot-no,.slot.win .slot-name{animation:pop .55s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{0%{transform:scale(.4);opacity:0}100%{transform:scale(1);opacity:1}}
.status{margin:14px 0 6px;font-size:14px;color:var(--sub);min-height:20px}
.winners{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.wrow{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 14px;text-align:left;animation:pop .4s ease-out}
.wrow b{font-size:18px;min-width:44px}
.wrow.mine{border-color:var(--fire);background:#fff3ea}
.mewin{background:linear-gradient(135deg,#ffefe2,#fff6d8);border:2px solid var(--fire);border-radius:18px;padding:14px;margin-top:12px;font-weight:800;font-size:18px;animation:pop .6s}

/* ladder */
.lad{--n:4}
.lad-grid{display:grid;grid-template-columns:repeat(var(--n),1fr);gap:0}
.lslot{margin:0 2px;border:1.5px dashed var(--line);background:#fff;border-radius:12px;padding:8px 2px;font-size:12.5px;min-height:46px;display:flex;align-items:center;justify-content:center;text-align:center;word-break:keep-all;line-height:1.2}
.lslot.taken{border-style:solid;border-color:var(--ink);font-weight:700}
.lslot.mine{background:var(--fire);color:#fff;border-color:var(--fire)}
.lslot.empty{color:var(--sub)}
.lad svg{width:100%;height:auto;display:block;margin:6px 0}
.lpz{margin:0 2px;border-radius:12px;padding:8px 2px;font-size:12.5px;min-height:46px;display:flex;align-items:center;justify-content:center;text-align:center;background:var(--ink);color:#fff;font-weight:700;word-break:keep-all;line-height:1.2}
.lad.done .lpz{font-size:15px}
.ladadmin{margin:14px 0 4px;padding:12px;border:2px dashed var(--fire2);border-radius:16px;text-align:center}
.ladadmin .btn{padding:13px 22px}
.lpz.hide{background:#d9d2c2;color:#8b8577;font-size:20px}
.lpz.kkwang{background:#e9e4d8;color:var(--sub)}
.lpz.mine{outline:3px solid var(--fire);outline-offset:1px}

/* chat */
.chat-head{flex:none;padding:10px 16px;font-size:12.5px;color:var(--sub);background:var(--bg);border-bottom:1px solid var(--line);line-height:1.45}
.chat-head b{color:var(--ink)}
.chat-list{flex:1;overflow:auto;padding:12px 12px 6px;display:flex;flex-direction:column;gap:8px}
.msg{display:flex;gap:8px;align-items:flex-end;max-width:86%}
.msg .av{flex:none;width:32px;height:32px;border-radius:50%;background:var(--card);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:17px;align-self:flex-start}
.msg .who{font-size:11.5px;color:var(--sub);margin:0 0 3px 2px}
.msg .who .real{color:var(--red);font-weight:700}
.bubble{background:var(--card);border:1px solid var(--line);border-radius:16px 16px 16px 4px;padding:8px 12px;font-size:15px;line-height:1.45;white-space:pre-wrap;word-break:break-word}
.msg .tm{font-size:10.5px;color:var(--sub);flex:none}
.msg.me{align-self:flex-end;flex-direction:row-reverse}
.msg.me .bubble{background:var(--ink);color:#fff;border-color:var(--ink);border-radius:16px 16px 4px 16px}
.msg.admin .bubble{background:#fff3ea;border-color:var(--fire)}
.msg.me.admin .bubble{background:var(--fire);border-color:var(--fire)}
.msg .del{border:0;background:none;color:var(--sub);font-size:13px;padding:2px 4px}
.chat-form{flex:none;display:flex;gap:8px;padding:10px 12px;background:var(--card);border-top:1px solid var(--line)}
.chat-form input{flex:1;border:1px solid var(--line);border-radius:999px;padding:11px 16px;font-size:16px;outline:none;background:#fff;min-width:0}
.chat-form button{border:0;border-radius:999px;background:var(--fire);color:#fff;font-weight:800;padding:0 18px}
.sys{align-self:center;font-size:12px;color:var(--sub);background:var(--card);border:1px solid var(--line);padding:5px 12px;border-radius:999px}

/* results */
.hist{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.hist:last-child{border-bottom:0}
.hist .pz{flex:1;min-width:0}
.hist .pz b{display:block;font-size:15px}
.hist .pz span{font-size:12px;color:var(--sub)}
.hist .nm{font-weight:800;font-size:15px;text-align:right}
.hist.mine{background:#fff3ea;margin:0 -10px;padding:12px 10px;border-radius:12px}

/* admin */
.rlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:6px;margin-top:10px}
.ritem{font-size:13px;padding:7px 9px;border-radius:10px;background:var(--bg);border:1px solid var(--line);display:flex;gap:6px;align-items:center}
.ritem.in{background:#eaf5ec;border-color:#bfe0c6}
.ritem b{font-variant-numeric:tabular-nums}
.sep{height:1px;background:var(--line);margin:14px 0}


/* poll */
.popts{display:flex;flex-direction:column;gap:8px}
.popt{position:relative;overflow:hidden;display:flex;align-items:center;gap:8px;border:1.5px solid var(--line);background:#fff;border-radius:14px;padding:14px;text-align:left;font-size:15.5px;font-weight:600;color:var(--ink)}
.popt .pbar{position:absolute;left:0;top:0;bottom:0;width:0;background:#fde3d3;transition:width .5s ease}
.popt .ptx,.popt .pct{position:relative}
.popt .ptx{flex:1}
.popt .pct{font-size:13px;color:var(--sub);font-weight:700}
.popt.mine{border-color:var(--fire)}
.popt.mine .ptx::after{content:" ✓";color:var(--fire)}
.popt.top{border-color:var(--gold);border-width:2.5px}
.popt.top .ptx::before{content:"👑 "}
.popt:disabled{opacity:1;cursor:default}
/* race */
.racebtn{width:220px;height:220px;border-radius:50%;border:0;font-size:30px;font-weight:900;color:#fff;margin:6px auto 0;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:background .08s,transform .08s;box-shadow:0 10px 0 rgba(0,0,0,.18);user-select:none;-webkit-user-select:none;touch-action:manipulation}
.racebtn:active{transform:translateY(5px);box-shadow:0 5px 0 rgba(0,0,0,.18)}
.racebtn small{font-size:17px;font-weight:700;opacity:.9;margin-top:4px}
.racebtn.wait{background:var(--red)}
.racebtn.go{background:#2f9e5b;animation:pulse .5s infinite alternate}
.racebtn.done{background:var(--ink)}
.racebtn.foul{background:#8b8577}
@keyframes pulse{to{transform:scale(1.05)}}
/* rps */
.rps-host{font-size:16px;font-weight:700;margin:4px 0 14px;display:flex;align-items:center;justify-content:center;gap:10px}
.rps-host b{font-size:58px;line-height:1}
.rps-host b.pop{animation:pop .6s cubic-bezier(.2,1.6,.4,1)}
.rps-picks{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.rpsb{border:2px solid var(--line);background:#fff;border-radius:20px;padding:16px 4px 12px;font-size:14px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--ink)}
.rpsb span{font-size:46px;line-height:1}
.rpsb.mine{border-color:var(--fire);background:#fff3ea;transform:scale(1.04)}

/* blink */
.flashbox{border-radius:26px;min-height:46vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:var(--ink);background:#e9e4d8;transition:background .3s;margin-bottom:6px}
.flashbox .fbig{font-size:48px;font-weight:900;line-height:1.1}
.flashbox .fsub{font-size:17px;font-weight:700}
.flashbox.ready{background:var(--ink);color:#fff}
.flashbox.on{animation:flash .5s steps(1) infinite;color:#fff}
.flashbox.final{background:#fff8e6;color:var(--ink);border:3px solid var(--gold);animation:pop .6s}
.flashbox.final .fsub{color:var(--sub);font-size:15px}
.flashbox.safe{background:#eaf5ec;color:var(--moss);border:2px solid #bfe0c6}
.flashbox.watch{background:#fff;border:2px dashed var(--line)}
.flashbox.dead{background:#d6d0c3;color:#6f6a60}
.flashbox.win{background:linear-gradient(135deg,var(--fire),var(--gold));color:#fff;animation:pop .6s}
@keyframes flash{0%{background:var(--fire)}50%{background:#f6c56b}}
.bchips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:12px}
.bchip{font-size:13px;padding:6px 10px;border-radius:999px;background:#fff;border:1px solid var(--line);font-weight:600}
.bchip.on{animation:chipflash .5s steps(1) infinite}
.bchip.out{background:#e2ddd1;color:#a39d90;text-decoration:line-through}
.bchip.champ{background:var(--gold);color:#fff;border-color:var(--gold)}
.bchip.me{outline:2px solid var(--ink);outline-offset:1px}
@keyframes chipflash{0%{background:#ffe1c9}50%{background:#fff}}
.ritem{font:inherit;cursor:pointer;text-align:left;color:inherit}
.ritem.sel{border-color:var(--fire);background:#fff3ea}
.editbox{margin-top:12px;padding:14px;border-radius:14px;background:var(--bg);border:1px solid var(--line)}

/* liar */
.lword{width:100%;border:0;border-radius:24px;background:var(--ink);color:#fff;padding:26px 16px;display:flex;flex-direction:column;align-items:center;gap:10px}
.lword small{font-size:13px;opacity:.75}
.lword b{font-size:40px;font-weight:900;letter-spacing:-1px}
.lword.open{background:linear-gradient(135deg,var(--fire),var(--gold))}
button.wrow{font:inherit;color:inherit;width:100%;cursor:pointer}
button.wrow:disabled{cursor:default;opacity:1}
.wrow.voted{border-color:#8a5cc2;background:#f3ecff;border-width:2px}
.wrow.voted::after{content:"🗳️";margin-left:6px}
.wrow.liarrow{border-color:#8a5cc2;background:#f3ecff}
.lrsay{flex-basis:100%;text-align:left;font-size:14px;margin:6px 0 0 54px;color:var(--ink);font-weight:600}
.wrow.outrow{background:#ece7dc;border-color:#cfc6b3;color:#6f6a60}
.wrow.cur{border-color:var(--fire);border-width:2px;background:#fff3ea}
.lrform{display:flex;gap:8px;margin:10px 0 4px}
.lrform input{flex:1;min-width:0;border:2px solid var(--fire);border-radius:14px;padding:13px 14px;font-size:16px;outline:none;background:#fff}
.lrform input:disabled{border-color:var(--line);background:#f4f1ea}
.lrform button{border:0;border-radius:14px;background:var(--fire);color:#fff;font-weight:800;padding:0 18px}

/* big prize */
.bigprize{background:linear-gradient(135deg,#fff3e6,#fff8dd);border:2px solid var(--fire2);border-radius:22px;padding:16px 14px;margin:0 0 14px;text-align:center;display:flex;flex-direction:column;gap:4px;align-items:center}
.bigprize small{font-size:13px;color:var(--fire);font-weight:800;letter-spacing:.5px}
.bigprize b{font-size:30px;font-weight:900;line-height:1.2;word-break:keep-all;letter-spacing:-.5px}
.bigprize span{font-size:13px;color:var(--sub);font-weight:700}
.prizewin{background:linear-gradient(135deg,var(--fire),var(--gold));color:#fff;border-radius:20px;padding:18px 14px;text-align:center;animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
.prizewin .pw-prize{font-size:28px;font-weight:900;word-break:keep-all;line-height:1.2}
.prizewin .pw-who{font-size:18px;font-weight:800;margin-top:6px;opacity:.95}
.prizewin.mine{outline:4px solid var(--ink);outline-offset:2px}

/* mafia */
.nightwrap{background:#1f1e36;color:#f1efff;border-radius:24px;padding:16px;margin:-4px -4px 0}
.nightwrap .muted{color:#bdb8e0}
.nightwrap .wrow{background:#2b2a4a;border-color:#3c3a63;color:#f1efff}
.nightwrap .wrow.voted{background:#5b3f9e;border-color:#b79cff}
.nightwrap .card{background:#2b2a4a;border-color:#3c3a63;color:#bdb8e0}
.lword.mfrole.mafia{background:linear-gradient(135deg,#3a1020,#c1272d)}
.wrow.mfrow{border-color:var(--red);background:#fdeceb}

.mffeed{background:#fff;border:1px solid var(--line);border-radius:16px;padding:10px;height:34vh;overflow:auto;text-align:left;display:flex;flex-direction:column;gap:6px}
.fmsg{font-size:14.5px;line-height:1.4;background:var(--bg);border-radius:12px;padding:7px 10px;align-self:flex-start;max-width:92%}
.fmsg b{font-size:12.5px;color:var(--fire);margin-right:4px}
.fmsg.me{align-self:flex-end;background:#fff3ea}
.card.defense{text-align:center;margin:10px 0}
.card.defense small{display:block;color:var(--red);font-weight:800;margin-bottom:6px}
.card.defense #mfdef{font-size:20px;font-weight:800;line-height:1.4;word-break:keep-all}
.judge{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:8px 0}
.jbtn{border:2px solid var(--line);background:#fff;border-radius:18px;padding:20px 6px;font-size:20px;font-weight:900;color:var(--ink)}
.jbtn.kill.on{background:var(--red);color:#fff;border-color:var(--red)}
.jbtn.save.on{background:var(--moss);color:#fff;border-color:var(--moss)}

/* updown / nunchi / tap */
.udrange{background:var(--ink);color:#fff;border-radius:24px;padding:22px 10px;display:flex;flex-direction:column;align-items:center;gap:4px;margin-bottom:10px}
.udrange b{font-size:46px;font-weight:900;letter-spacing:-1px}
.udrange small{opacity:.75;font-size:14px}
.ncfeed{display:flex;flex-direction:column;gap:6px;margin-top:14px}
.ncrow{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:9px 14px;animation:pop .35s}
.ncrow b{font-size:20px;min-width:30px}
.ncrow span{flex:1;text-align:left;font-weight:700}
.ncrow em{font-style:normal;color:var(--red);font-weight:800}
.ncrow.boom{border-color:var(--red);background:#fdeceb}
.tapbtn{width:230px;height:230px;border-radius:50%;border:0;background:#cfc6b3;color:#fff;margin:8px auto 0;display:flex;flex-direction:column;align-items:center;justify-content:center;touch-action:manipulation;user-select:none;-webkit-user-select:none;box-shadow:0 10px 0 rgba(0,0,0,.18)}
.tapbtn b{font-size:64px;font-weight:900;line-height:1}
.tapbtn small{font-size:16px;font-weight:800;margin-top:6px}
.tapbtn.live{background:linear-gradient(135deg,var(--fire),var(--red))}
.tapbtn.live:active{transform:translateY(5px) scale(.97);box-shadow:0 5px 0 rgba(0,0,0,.18)}

/* 참여 랭킹 레이스 (원래 디자인 유지, 이 안에서만 적용) */
.rk{--rbg:#0f1714;--rpanel:#16211d;--rink:#eef2ea;--rmuted:#93a39a;--rline:#26342e;--raccent:#f2b25c;--rflash:#ffe3a8;background:var(--rbg);color:var(--rink);border-radius:20px;padding:16px 12px 14px;text-align:left}
.rk-head{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;flex-wrap:wrap}
.rk-head h1{margin:0;font-size:19px;letter-spacing:-.02em}
.rk-head h1 small{display:block;font-size:11px;font-weight:500;color:var(--rmuted);letter-spacing:.08em;margin-bottom:4px}
.rk .stats{display:flex;gap:14px}
.rk .stat{text-align:right}
.rk .stat b{display:block;font-size:20px;font-variant-numeric:tabular-nums}
.rk .stat span{font-size:10.5px;color:var(--rmuted)}
.rk-mtabs{display:flex;gap:6px;margin-top:14px}
.rk-mtabs button{background:#22302a;color:var(--rink);border:1px solid var(--rline);border-radius:999px;padding:7px 14px;font:inherit;font-size:13px;font-weight:600}
.rk-mtabs button.on{background:var(--raccent);color:#1b1408;border-color:var(--raccent);font-weight:800}
.rk-mtabs.locked button:not(.on){display:none}
.rk-now{margin:14px 0 8px;padding:12px 14px;background:var(--rpanel);border:1px solid var(--rline);border-radius:12px;min-height:92px}
.rk-now .row1{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.rk-now .date{font-size:24px;font-weight:800;color:var(--raccent);font-variant-numeric:tabular-nums}
.rk-now .ev{font-size:16px;font-weight:700}
.rk-now .host{font-size:12px;color:var(--rmuted)}
.rk-now .tag{font-size:11px;padding:2px 7px;border-radius:999px;border:1px solid var(--raccent);color:var(--raccent)}
.rk-now .chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.rk-now .chip{font-size:12px;padding:3px 8px;border-radius:999px;background:#22302a;color:#dfe7dc}
.rk-chart{position:relative;margin-top:6px}
.rk-bar{position:absolute;left:0;right:0;height:26px;display:flex;align-items:center;will-change:transform}
.rk-bar .nm{width:54px;flex:none;text-align:right;padding-right:8px;font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rk-bar .track{position:relative;flex:1;height:100%}
.rk-bar .fill{position:absolute;left:0;top:2px;bottom:2px;border-radius:4px;min-width:2px;transition:box-shadow .3s}
.rk-bar .val{position:absolute;top:50%;transform:translateY(-50%);font-size:12.5px;font-weight:700;font-variant-numeric:tabular-nums;padding-left:6px;white-space:nowrap}
.rk-bar .plus{color:var(--rflash);font-size:11px;margin-left:4px;opacity:0;transition:opacity .25s}
.rk-bar.hit .plus{opacity:1}
.rk-bar.hit .fill{box-shadow:0 0 0 2px var(--rflash)}
.rk-controls{display:flex;align-items:center;gap:8px;margin-top:14px;flex-wrap:wrap}
.rk-controls button,.rk-controls select{background:#22302a;color:var(--rink);border:1px solid var(--rline);border-radius:8px;padding:7px 11px;font:inherit;font-size:13px}
.rk-controls button.primary{background:var(--raccent);color:#1b1408;border-color:var(--raccent);font-weight:700}
.rk-controls input[type=range]{flex:1;min-width:120px;accent-color:var(--raccent)}
.rk-lock{display:none;width:100%;font-size:12.5px;color:var(--raccent);font-weight:700}
.rk-controls.locked>*:not(.rk-lock){display:none}
.rk-controls.locked .rk-lock{display:block}
.rk-foot{margin-top:10px;font-size:11px;color:var(--rmuted)}
/* 랭킹 편집기 */
.rked{position:fixed;inset:0;background:rgba(20,18,14,.55);display:none;z-index:60}
.rked.open{display:flex;justify-content:center;align-items:stretch;padding:16px 10px}
.rked-box{background:var(--card);border-radius:18px;width:100%;max-width:640px;display:flex;flex-direction:column;overflow:hidden}
.rked-head{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--line)}
.rked-tabs{display:flex;gap:6px;padding:10px 16px 0}
.rked-tabs button{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:6px 14px;font-size:13px}
.rked-tabs button.on{background:var(--ink);color:#fff;border-color:var(--ink);font-weight:700}
.rked-body{flex:1;overflow:auto;padding:12px 16px 16px}
.rked-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px;border-top:1px solid var(--line);flex-wrap:wrap}
.rked-list{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.rked-item{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--bg);border:1px solid var(--line);border-radius:12px;cursor:pointer}
.rked-item .d{width:44px;flex:none;color:var(--fire);font-weight:800;font-size:13px}
.rked-item .t{flex:1;min-width:0}
.rked-item .t b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---------- SHA-256 (전화번호는 원문 대신 이 값으로만 저장) ---------- */
const sha256hex = (() => {
  const K = [], H0 = [];
  let n = 2, c = 0;
  while (c < 64) {
    let p = true; for (let d = 2; d * d <= n; d++) if (n % d === 0) { p = false; break; }
    if (p) { if (c < 8) H0[c] = (Math.pow(n, 1 / 2) * 2 ** 32) | 0; K[c] = (Math.pow(n, 1 / 3) * 2 ** 32) | 0; c++; }
    n++;
  }
  const rotr = (x, k) => (x >>> k) | (x << (32 - k));
  return str => {
    const b = new TextEncoder().encode(str), l = b.length, len = ((l + 9 + 63) >> 6) << 6;
    const m = new Uint8Array(len); m.set(b); m[l] = 0x80;
    const dv = new DataView(m.buffer); dv.setUint32(len - 4, (l * 8) >>> 0); dv.setUint32(len - 8, Math.floor(l * 8 / 2 ** 32));
    const H = H0.slice(), w = new Int32Array(64);
    for (let i = 0; i < len; i += 64) {
      for (let t = 0; t < 16; t++) w[t] = dv.getUint32(i + t * 4);
      for (let t = 16; t < 64; t++) {
        const a = w[t - 15], d = w[t - 2];
        w[t] = (w[t - 16] + (rotr(a, 7) ^ rotr(a, 18) ^ (a >>> 3)) + w[t - 7] + (rotr(d, 17) ^ rotr(d, 19) ^ (d >>> 10))) | 0;
      }
      let [A, B, C, D, E, F, G, Hh] = H;
      for (let t = 0; t < 64; t++) {
        const t1 = (Hh + (rotr(E, 6) ^ rotr(E, 11) ^ rotr(E, 25)) + ((E & F) ^ (~E & G)) + K[t] + w[t]) | 0;
        const t2 = ((rotr(A, 2) ^ rotr(A, 13) ^ rotr(A, 22)) + ((A & B) ^ (A & C) ^ (B & C))) | 0;
        Hh = G; G = F; F = E; E = (D + t1) | 0; D = C; C = B; B = A; A = (t1 + t2) | 0;
      }
      H[0] = (H[0] + A) | 0; H[1] = (H[1] + B) | 0; H[2] = (H[2] + C) | 0; H[3] = (H[3] + D) | 0;
      H[4] = (H[4] + E) | 0; H[5] = (H[5] + F) | 0; H[6] = (H[6] + G) | 0; H[7] = (H[7] + Hh) | 0;
    }
    return H.map(x => (x >>> 0).toString(16).padStart(8, "0")).join("");
  };
})();

/* ---------- 저장소: Firebase ---------- */
function loadScript(src) { return new Promise((ok, no) => { const s = document.createElement("script"); s.src = src; s.onload = ok; s.onerror = () => no(new Error("load " + src)); document.head.appendChild(s); }); }
async function makeFirebase(cfg) {
  const V = "10.12.2", base = `https://www.gstatic.com/firebasejs/${V}/`;
  await loadScript(base + "firebase-app-compat.js");
  await Promise.all([loadScript(base + "firebase-auth-compat.js"), loadScript(base + "firebase-database-compat.js")]);
  firebase.initializeApp(cfg);
  const auth = firebase.auth(), db = firebase.database();
  let offset = 0;
  db.ref(".info/serverTimeOffset").on("value", s => offset = s.val() || 0);
  const who = () => { const u = auth.currentUser; return u ? { uid: u.uid, isAdmin: !!u.email } : null; };
  return {
    mode: "firebase",
    async start() {
      await new Promise(r => { const un = auth.onAuthStateChanged(() => { un(); r(); }); });
      if (!auth.currentUser) await auth.signInAnonymously();
      return who();
    },
    async adminLogin(email, pw) { await auth.signInWithEmailAndPassword(email, pw); return who(); },
    async logout() { await auth.signOut(); },
    async get(p) { return (await db.ref(p).get()).val(); },
    set: (p, v) => db.ref(p).set(v),
    update: (p, v) => (p ? db.ref(p) : db.ref()).update(v),
    async push(p, v) { const r = db.ref(p).push(); await r.set(v); return r.key; },
    remove: p => db.ref(p).remove(),
    on(p, cb) { const r = db.ref(p), h = s => cb(s.val()); r.on("value", h, e => console.warn(p, e.message)); return () => r.off("value", h); },
    onLast(p, n, cb) {
      const q = db.ref(p).orderByChild("ts").limitToLast(n);
      const h = s => { const a = []; s.forEach(c => { a.push({ id: c.key, ...c.val() }); }); cb(a); };
      q.on("value", h, e => console.warn(p, e.message)); return () => q.off("value", h);
    },
    async claim(p, v) { try { await db.ref(p).set(v); return true; } catch (e) { return false; } },
    now: () => Date.now() + offset,
    serverTs: () => firebase.database.ServerValue.TIMESTAMP,
    presence(uid) {
      const r = db.ref("online/" + uid);
      db.ref(".info/connected").on("value", s => { if (s.val()) { r.onDisconnect().remove(); r.set(true); } });
    }
  };
}

/* ---------- 저장소: 데모 (같은 브라우저의 탭끼리만 공유) ---------- */
function makeDemo() {
  const KEY = "calmping_lucky_demo";
  const bc = "BroadcastChannel" in window ? new BroadcastChannel(KEY) : null;
  const load = () => { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch { return {}; } };
  let tree = load();
  const subs = new Set();
  const notify = () => subs.forEach(f => f());
  addEventListener("storage", e => { if (e.key === KEY) { tree = load(); notify(); } });
  if (bc) bc.onmessage = () => { tree = load(); notify(); };
  const save = () => { localStorage.setItem(KEY, JSON.stringify(tree)); bc && bc.postMessage(1); notify(); };
  const ks = p => p.split("/").filter(Boolean);
  const getP = p => { let n = tree; for (const k of ks(p)) { if (n == null || typeof n !== "object") return null; n = n[k]; } return n === undefined ? null : n; };
  const setP = (p, v) => {
    const k = ks(p); if (!k.length) { tree = v || {}; return; }
    let n = tree;
    for (let i = 0; i < k.length - 1; i++) { if (typeof n[k[i]] !== "object" || n[k[i]] == null) n[k[i]] = {}; n = n[k[i]]; }
    if (v == null) delete n[k[k.length - 1]]; else n[k[k.length - 1]] = JSON.parse(JSON.stringify(v));
  };
  const SK = KEY + "_sess";
  let sess; try { sess = JSON.parse(sessionStorage.getItem(SK)); } catch { }
  if (!sess) { sess = { uid: "u" + Math.random().toString(36).slice(2, 10), isAdmin: false }; sessionStorage.setItem(SK, JSON.stringify(sess)); }
  const api = {
    mode: "demo",
    async start() { return { ...sess }; },
    async adminLogin(email, pw) {
      if (pw !== "calmping") throw new Error("데모 관리자 비밀번호는 calmping 이에요");
      sess = { uid: "admin_" + sess.uid, isAdmin: true }; sessionStorage.setItem(SK, JSON.stringify(sess)); return { ...sess };
    },
    async logout() { sessionStorage.removeItem(SK); },
    async get(p) { tree = load(); const v = getP(p); return v == null ? null : JSON.parse(JSON.stringify(v)); },
    async set(p, v) { tree = load(); setP(p, v); save(); },
    async update(p, o) { tree = load(); for (const k in o) setP(p + "/" + k, o[k]); save(); },
    async push(p, v) { const k = newId(); tree = load(); setP(p + "/" + k, v); save(); return k; },
    async remove(p) { tree = load(); setP(p, null); save(); },
    on(p, cb) {
      let last;
      const f = () => { const v = getP(p), s = JSON.stringify(v ?? null); if (s !== last) { last = s; cb(JSON.parse(s)); } };
      subs.add(f); setTimeout(f, 0); return () => subs.delete(f);
    },
    onLast(p, n, cb) { return api.on(p, v => cb(Object.entries(v || {}).map(([id, x]) => ({ id, ...x })).sort((a, b) => a.ts - b.ts).slice(-n))); },
    async claim(p, v) { tree = load(); if (getP(p) != null) return false; setP(p, v); save(); return true; },
    now: () => Date.now(),
    serverTs: () => Date.now(),
    presence(uid) { api.set("online/" + uid, true); addEventListener("pagehide", () => { tree = load(); setP("online/" + uid, null); save(); }); }
  };
  return api;
}

const LOGO = `<img src="${LOGO_FULL}" alt="calmping · keep calm, go camping">`;

/* ---------- 부팅 ---------- */
async function boot() {
  try { B = FIREBASE_CONFIG ? await makeFirebase(FIREBASE_CONFIG) : makeDemo(); S.me = await B.start(); }
  catch (e) { $("#root").innerHTML = `<div class="login"><div class="box"><h1>연결 오류</h1><p class="muted">${esc(e.message)}<br>인터넷 연결 또는 Firebase 설정을 확인해주세요.</p></div></div>`; return; }
  if (S.me.isAdmin) return enter();
  if (location.hash === "#admin") return adminLoginView();
  const m = await B.get("members/" + S.me.uid).catch(() => null);
  if (m) {
    const [r, c] = await Promise.all([B.get("roster/" + m.h).catch(() => null), B.get("claims/" + m.h).catch(() => null)]);
    if (r && c === S.me.uid) { S.member = m; S.rosterMe = r; return enter(); }
    if (r && c) return loginView("이 번호는 다른 기기에서 접속 중이라 이 기기는 로그아웃됐어요.");
  }
  loginView();
}
addEventListener("hashchange", () => location.reload());

const demoBanner = () => B.mode === "demo" ? `<div class="demo-banner"><b>데모 모드</b> · 이 브라우저 안에서만 동작해요. 탭을 여러 개 열어 참여자처럼 테스트해보세요. 관리자: 주소 끝에 <b>#admin</b>, 비밀번호 <b>calmping</b></div>` : "";

function loginView(notice) {
  $("#root").innerHTML = `${demoBanner()}<div class="login"><div class="box">
    <div class="logo-mark">${LOGO}</div>
    <p class="muted">${esc(EVENT_TITLE)}<br>신청할 때 적은 휴대폰 번호로 입장해주세요</p>
    <input class="inp" id="ph" inputmode="numeric" autocomplete="tel" placeholder="010-0000-0000" maxlength="13">
    <button class="btn fire" id="go">입장하기</button>
    <div class="err" id="err">${notice ? esc(notice) : ""}</div>
    <p class="muted" style="font-size:11.5px;margin-top:14px">번호는 본인 확인에만 쓰이고, 번호 그대로는 저장되지 않아요.</p>
  </div></div>`;
  const ph = $("#ph");
  ph.addEventListener("input", () => {
    const d = ph.value.replace(/\D/g, "").slice(0, 11);
    ph.value = d.length < 4 ? d : d.length < 8 ? d.slice(0, 3) + "-" + d.slice(3) : d.slice(0, 3) + "-" + d.slice(3, d.length - 4) + "-" + d.slice(-4);
  });
  const go = async () => {
    const d = normPhone(ph.value), err = $("#err"); err.textContent = "";
    if (d.length < 10 || d.length > 11) { err.textContent = "휴대폰 번호를 정확히 입력해주세요"; return; }
    $("#go").disabled = true;
    try {
      const h = phoneKey(d);
      const r = await B.get("roster/" + h);
      if (!r) { err.textContent = "참가자 명단에 없는 번호예요. 운영진에게 문의해주세요."; return; }
      const cur = await B.get("claims/" + h);
      if (cur && cur !== S.me.uid && await B.get("online/" + cur)) {
        err.innerHTML = "이 번호는 이미 <b>다른 기기(또는 다른 앱)</b>에서 접속 중이에요.<br>한 번호는 한 기기에서만 입장할 수 있어요. 다른 화면을 닫고 잠시 뒤 다시 시도하거나 운영진에게 문의해주세요.";
        return;
      }
      const m = { h, alias: makeAlias(), ts: B.now() };
      await B.update("", { ["claims/" + h]: S.me.uid, ["members/" + S.me.uid]: m });
      S.member = m; S.rosterMe = r; enter();
    } catch (e) { err.textContent = "입장 중 오류가 났어요: " + e.message; }
    finally { const g = $("#go"); if (g) g.disabled = false; }
  };
  $("#go").onclick = go;
  ph.addEventListener("keydown", e => { if (e.key === "Enter" && !e.isComposing) go(); });
}

function adminLoginView() {
  $("#root").innerHTML = `${demoBanner()}<div class="login"><div class="box">
    <div class="logo-mark sm">${LOGO}</div>
    <h1>운영진 로그인</h1><p class="muted">${esc(EVENT_TITLE)}</p>
    ${B.mode === "firebase" ? `<input class="inp" id="em" type="email" placeholder="관리자 이메일" style="font-size:16px;letter-spacing:0;margin-bottom:8px">` : ""}
    <input class="inp" id="pw" type="password" placeholder="비밀번호" style="font-size:16px;letter-spacing:0">

/* 번호뽑기 */
function buildDraw(st) {
  return `<div class="draw">
    <div class="bigprize"><small>🎁 이번 상품</small><b>${esc(st.prize)}</b>${st.winners.length > 1 ? `<span>${st.winners.length}명 추첨</span>` : ""}</div>
    <div class="slot" id="slot"><div class="slot-no" id="slot-no">?</div><div class="slot-name" id="slot-name"></div></div>
    <div class="status" id="dstatus"></div>
    <div id="mewin"></div>
    <div class="winners" id="wlist"></div>
  </div>`;
}
function drawFrame(st, now) {
  const per = st.per || 4500, roll = per - 1300, t = now - st.startAt, W = st.winners, P = st.pool;
  if (t < 0) return { phase: "wait", left: Math.ceil(-t / 1000), revealed: 0 };
  const i = Math.floor(t / per);
  if (i >= W.length) return { phase: "done", revealed: W.length, cur: W[W.length - 1] };
  const local = t - i * per;
  if (local < roll) {
    const x = local / roll, steps = Math.floor(48 * (1 - (1 - x) * (1 - x))); // 점점 느려지게
    return { phase: "roll", idx: i, revealed: i, cur: P[(steps * 7 + i * 11) % P.length] };
  }
  return { phase: "show", idx: i, revealed: i + 1, cur: W[i] };
}
function updateDraw(st) {
  const f = drawFrame(st, B.now()), slot = $("#slot"); if (!slot) return;
  const ds = S.drawState, sig = f.phase + (f.cur ? f.cur.no : "") + (f.left || "") + f.revealed;
  if (ds.sig === sig) return; ds.sig = sig;
  const no = $("#slot-no"), nm = $("#slot-name"), status = $("#dstatus");
  slot.classList.toggle("rolling", f.phase === "roll");
  const win = f.phase === "show" || f.phase === "done";
  slot.classList.toggle("win", win);
  if (f.phase === "wait") { no.textContent = f.left; nm.textContent = "곧 추첨을 시작해요"; status.textContent = `참가 후보 ${st.pool.length}명`; }
  else { no.textContent = "#" + f.cur.no; nm.textContent = S.me.isAdmin ? f.cur.name : f.phase === "roll" ? "LUCKY NUMBER" : (S.rosterMe && f.cur.no === S.rosterMe.no ? "🎉 나예요!" : "당첨!"); status.textContent = f.phase === "roll" ? `${f.idx + 1}번째 당첨자 뽑는 중…` : f.phase === "done" ? "추첨 완료! 축하합니다 🎉" : `${f.idx + 1}번째 당첨자!`; }
  const rev = st.winners.slice(0, f.revealed), myNo = S.rosterMe && S.rosterMe.no;
  const wl = $("#wlist");
  if (wl.children.length !== rev.length) wl.innerHTML = rev.map(w => `<div class="wrow ${w.no === myNo ? "mine" : ""}"><b>#${w.no}</b><span>${dn(w.name, w.no === myNo)}</span></div>`).join("");
  if (rev.length) {
    const k = st.id + ":" + (rev.length - 1);
    if (!S.fired.has(k) && f.phase !== "roll") { S.fired.add(k); confetti(rev[rev.length - 1].no === myNo ? 220 : 90); }
  }

  }
}

/* 사다리타기 */
const LW = 600, LH = 420;
const lx = (n, c) => LW / n * (c + .5);
const ly = (R, r) => 10 + (r + 1) * (LH - 20) / (R + 1);
function rungSet(st) { return new Set((st.rungs || []).map(String)); }
function ladderEnd(st, c, set) {
  for (let r = 0; r < st.rows; r++) { if (set.has(r + "," + c)) c++; else if (set.has(r + "," + (c - 1))) c--; }
  return c;
}
function ladderPath(st, c, set) {
  let d = `M${lx(st.n, c)} 0`;
  for (let r = 0; r < st.rows; r++) {
    const y = ly(st.rows, r);
    if (set.has(r + "," + c)) { d += ` L${lx(st.n, c)} ${y} L${lx(st.n, c + 1)} ${y}`; c++; }
    else if (set.has(r + "," + (c - 1))) { d += ` L${lx(st.n, c)} ${y} L${lx(st.n, c - 1)} ${y}`; c--; }
  }
  return d + ` L${lx(st.n, c)} ${LH}`;
}
function genRungs(n, R) {
  for (let tries = 0; tries < 200; tries++) {
    const s = new Set();
    for (let r = 0; r < R; r++) for (let c = 0; c < n - 1; c++) if (!s.has(r + "," + (c - 1)) && rnd(100) < 42) s.add(r + "," + c);
    let ok = true; for (let c = 0; c < n - 1; c++) { let k = 0; for (let r = 0; r < R; r++) if (s.has(r + "," + c)) k++; if (k < 2) ok = false; }
    if (ok) return [...s];
  }
  const s = []; for (let r = 0; r < R; r++) s.push(r + "," + (r % (n - 1))); return s;
}
const COLORS = ["#e8743b", "#4f6b4a", "#3d6fb6", "#c1272d", "#8a5cc2", "#d9a52b", "#1f8a86", "#b4527a", "#6b4f2a", "#2f2f2f"];
function buildLadder(st) {
  const n = st.n, run = st.phase === "run", set = rungSet(st);
  let svg = `<svg viewBox="0 0 ${LW} ${LH}" id="lsvg">`;
  for (let c = 0; c < n; c++) svg += `<line x1="${lx(n, c)}" y1="0" x2="${lx(n, c)}" y2="${LH}" stroke="#cfc6b3" stroke-width="5" stroke-linecap="round"/>`;
  if (run) {
    for (const k of set) { const [r, c] = k.split(",").map(Number); svg += `<line x1="${lx(n, c)}" y1="${ly(st.rows, r)}" x2="${lx(n, c + 1)}" y2="${ly(st.rows, r)}" stroke="#cfc6b3" stroke-width="5" stroke-linecap="round"/>`; }
    for (let c = 0; c < n; c++) svg += `<path id="lp${c}" d="${ladderPath(st, c, set)}" fill="none" stroke="${COLORS[c % COLORS.length]}" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" opacity="0"/><circle id="lc${c}" r="11" fill="${COLORS[c % COLORS.length]}" opacity="0"/>`;
  } else {
    svg += `<text x="${LW / 2}" y="${LH / 2}" text-anchor="middle" font-size="24" fill="#8b8577" font-weight="700">가로줄은 출발할 때 공개돼요 🤫</text>`;
  }
  svg += `</svg>`;
  return `<div class="lad" style="--n:${n}">
    <div style="text-align:center"><div class="prize-label">🪜 사다리타기</div></div>
    ${(() => { const real = [...new Set(st.prizes.filter(p => p !== "꽝"))], kk = st.prizes.filter(p => p === "꽝").length; return real.length ? `<div class="bigprize"><small>🎁 이번 상품</small><b>${real.map(esc).join(" · ")}</b>${kk ? `<span>꽝 ${kk}칸 포함</span>` : ""}</div>` : ""; })()}
    <p class="muted" style="text-align:center;margin:0 0 10px" id="lhint"></p>
    <div class="lad-grid" id="ltop">${Array.from({ length: n }, (_, c) => `<button class="lslot" data-c="${c}"></button>`).join("")}</div>
    ${svg}
    <div class="lad-grid" id="lbot">${st.prizes.map((p, c) => `<div class="lpz hide" data-c="${c}">?</div>`).join("")}</div>

function myClaim() { for (const c in S.claims) if (S.claims[c] && S.claims[c].uid === S.me.uid) return +c; return -1; }
function updateLadderSlots(st) {
  if (S.me.isAdmin) {
    const f = $("#lad-fill"), r = $("#lad-run"), ag = $("#lad-again"), cnt = $("#lad-count");
    if (f) f.onclick = ladderFill;
    if (r) r.onclick = ladderRun;
    if (ag) ag.onclick = ladderOpen;
    if (cnt) cnt.textContent = `${Object.keys(S.claims || {}).length} / ${st.n}칸 선택됨`;
  }
  const mine = myClaim(), run = st.phase === "run";
  $$("#ltop .lslot").forEach(b => {
    const c = +b.dataset.c, cl = S.claims[c];
    b.className = "lslot " + (cl ? "taken" : "empty") + (c === mine ? " mine" : "");
    b.textContent = cl ? (S.me.isAdmin ? cl.name : c === mine ? `나 #${cl.no}` : `#${cl.no}`) : (run ? "-" : "＋ 선택");
    b.disabled = run && !S.me.isAdmin;
    b.onclick = () => claimCol(st, c);
  });
  const hint = $("#lhint");
  if (hint) hint.textContent = run ? "출발! 🏃" : S.me.isAdmin ? "참여자들이 칸을 고르는 중이에요. 칸을 누르면 비울 수 있어요." : mine >= 0 ? "선택 완료! 운영진이 출발을 누르면 시작돼요." : !canPlay(st) ? "이번 사다리는 구경해요 👀" : "원하는 칸을 하나 골라주세요 (선착순)";
}
async function claimCol(st, c) {
  if (st.phase !== "claim") return;
  if (S.me.isAdmin) { if (S.claims[c] && confirm(`${S.claims[c].name} 님을 이 칸에서 뺄까요?`)) B.remove("ladderClaims/" + c); return; }
  if (!canPlay(st)) return toast("이번 게임 참가자가 아니에요 · 구경해요 👀");
  if (myClaim() >= 0) return toast("이미 칸을 골랐어요");
  if (S.claims[c]) return toast("이미 다른 분이 고른 칸이에요");
  const ok = await B.claim("ladderClaims/" + c, { uid: S.me.uid, name: S.rosterMe.name, no: S.rosterMe.no });
  if (!ok) toast("앗, 방금 다른 분이 골랐어요!");
}
function updateLadder(st) {
  if (st.phase !== "run") return;
  const now = B.now(), p = Math.max(0, Math.min(1, (now - st.startAt) / st.dur)), set = rungSet(st);
  const mine = myClaim(), anyClaim = Object.keys(S.claims).length > 0;
  for (let c = 0; c < st.n; c++) {
    const path = $("#lp" + c), dot = $("#lc" + c); if (!path) return;
    const show = !anyClaim || S.claims[c];
    if (!show) continue;
    const L = path._len || (path._len = path.getTotalLength());
    path.setAttribute("opacity", mine < 0 || c === mine ? "1" : ".55");
    path.style.strokeDasharray = L; path.style.strokeDashoffset = L * (1 - p);
    const pt = path.getPointAtLength(L * p);
    dot.setAttribute("cx", pt.x); dot.setAttribute("cy", pt.y); dot.setAttribute("opacity", p > 0 && p < 1 ? "1" : "0");
  }
  const status = $("#lstatus");
  if (now < st.startAt) { status.textContent = `${Math.ceil((st.startAt - now) / 1000)}초 뒤 출발!`; return; }
  if (p < 1) { status.textContent = "내려가는 중… 두근두근"; return; }
  if (S.drawState.ladDone) return; S.drawState.ladDone = true;
  status.textContent = "결과 공개! 🎉";
  const ladEl = $(".lad"); if (ladEl) ladEl.classList.add("done");
  $$("#lbot .lpz").forEach(d => { const c = +d.dataset.c, pz = st.prizes[c]; d.textContent = pz; d.className = "lpz" + (pz === "꽝" ? " kkwang" : ""); });
  const res = [];
  for (let c = 0; c < st.n; c++) { const cl = S.claims[c]; if (!cl) continue; const e = ladderEnd(st, c, set); res.push({ ...cl, prize: st.prizes[e], end: e }); if (c === mine) $(`#lbot .lpz[data-c="${e}"]`).classList.add("mine"); }
  const wins = res.filter(r => r.prize !== "꽝"), loses = res.filter(r => r.prize === "꽝");
  $("#lres").innerHTML = wins.map(r => `<div class="prizewin ${r.uid === S.me.uid ? "mine" : ""}"><div class="pw-prize">🎁 ${esc(r.prize)}</div><div class="pw-who">#${r.no} ${dn(r.name, r.uid === S.me.uid)} 당첨!</div></div>`).join("")
    + loses.map(r => `<div class="wrow ${r.uid === S.me.uid ? "mine" : ""}"><b>#${r.no}</b><span style="flex:1">${dn(r.name, r.uid === S.me.uid)}</span><span>😅 꽝</span></div>`).join("");
  const me = res.find(r => r.uid === S.me.uid);
  if (me && me.prize !== "꽝") { $("#mewin").innerHTML = `<div class="mewin">🎉 축하해요! 🎁 ${esc(me.prize)} 당첨!</div>`; confetti(220); navigator.vibrate && navigator.vibrate([120, 60, 220]); }
  else if (me) { $("#mewin").innerHTML = `<div class="mewin" style="background:#f1ede4;border-color:#cfc6b3">😅 아쉽지만 꽝! 다음 기회에…</div>`; }
  else confetti(80);
}

/* 운영진 자동 진행: 화면 애니메이션과 별개로 타이머로 돌려서, 다른 탭/앱을 잠깐 봐도 멈추지 않게 */
function driveAll() {
  const st = S.stage; if (!st || !S.me || !S.me.isAdmin) return;
  if (st.type === "rps" && st.phase === "pick" && B.now() > st.deadline + 600 && !S.revealing) rpsReveal();
  if (st.type === "liar") liarDrive(st);
  if (st.type === "mafia") mafiaDrive(st);
  if (st.type === "updown") updownDrive(st);
  if (st.type === "nunchi") nunchiDrive(st);
  if (st.type === "tap") tapDrive(st);
  if (st.type === "blink") blinkLeftDrive(st);
  if (st.type === "ladder") ladderLeftDrive(st);
  if (st.type === "quiz") quizDrive(st);
  if (st.type === "poll" && st.open && st.endAt && B.now() > st.endAt + 500 && !S.pollClosing) { S.pollClosing = true; B.update("stage", { open: false }).finally(() => S.pollClosing = false); }
  if (st.type === "rps" && st.phase === "reveal" && st.nextAt && B.now() > st.nextAt && !S.advancing) rpsNext();
}
function tick() {
  requestAnimationFrame(tick);
  const st = S.stage; if (!st) return;
  if (S.tab !== "stage") return;
  if (st.type === "draw") updateDraw(st);
  else if (st.type === "ladder") updateLadder(st);
  else if (st.type === "race") updateRace(st);
  else if (st.type === "rps") updateRpsTick(st);
  else if (st.type === "blink") updateBlink(st);
  else if (st.type === "poll") updatePollTick(st);
  else if (st.type === "liar") updateLiarTick(st);
  else if (st.type === "mafia") updateMafiaTick(st);
  else if (st.type === "updown") updateUpdownTick(st);
  else if (st.type === "nunchi") updateNunchi(st);
  else if (st.type === "tap") updateTapTick(st);
  else if (st.type === "seat") updateSeat(st);
  else if (st.type === "quiz") updateQuiz(st);
}

async function saveRoster(text) {
  const lines = text.split(/\n/).map(s => s.trim()).filter(Boolean), add = {}, bad = [];
  const cur = S.roster || {};
  let next = Math.max(0, ...Object.values(cur).map(r => r.no || 0)) + 1;
  for (const ln of lines) {
    const m = ln.match(/(\+?82[\s-]?)?0?1[0-9][\s-]?\d{3,4}[\s-]?\d{4}/);
    if (!m) { bad.push(ln); continue; }
    const d = normPhone(m[0]); const ph = d.startsWith("0") ? d : "0" + d;
    const name = ln.replace(m[0], "").replace(/[,\t|/]/g, " ").trim().replace(/\s+/g, " ") || "이름없음";
    const h = phoneKey(ph);
    const no = (cur[h] && cur[h].no) || (add[h] && add[h].no) || next++;
    add[h] = { name, no };
  }
  if (!Object.keys(add).length) return toast(bad.length ? "번호를 찾지 못한 줄이 있어요" : "입력된 명단이 없어요");
  await B.update("roster", add);
  $("#a-roster").value = bad.join("\n");
  toast(`${Object.keys(add).length}명 저장${bad.length ? ` · 인식 못한 줄 ${bad.length}개는 남겨뒀어요` : ""}`);
}
/* 접속자: 같은 번호(=같은 사람)는 1명으로 */
function onlinePeople() {
  const map = new Map();
  for (const uid in S.online) {
    const m = S.members[uid]; if (!m) continue;
    const r = S.roster[m.h]; if (!r) continue;
    const e = map.get(m.h) || { h: m.h, name: r.name, no: r.no, n: 0 };
    e.n++; map.set(m.h, e);
  }
  return [...map.values()].sort((a, b) => a.no - b.no);
}
function renderOnline() {
  renderGp();
  const el = $("#online"); if (!el) return;
  if (!S.me.isAdmin) {
    const c = S.onlineCount != null ? S.onlineCount : Object.keys(S.online).length;
    el.textContent = "접속 " + c + "명"; return;
  }
  const list = onlinePeople();
  el.textContent = "접속 " + list.length + "명";
  if (S.onlineCountSent !== list.length) { S.onlineCountSent = list.length; B.set("onlineCount", list.length).catch(() => { }); }
  const box = $("#o-list"); if (!box) return;
  $("#o-n").textContent = list.length + "명";
  box.innerHTML = list.length ? list.map(p => `<div class="ritem in" data-oh="${p.h}" style="cursor:pointer"><b>#${p.no}</b>${esc(p.name)}${p.n > 1 ? ` <span class="muted" style="font-size:11px;margin-left:auto">${p.n}대</span>` : ""}</div>`).join("")
    : `<div class="muted">아직 접속한 사람이 없어요.</div>`;
  $$("[data-oh]", box).forEach(d => d.onclick = () => { S.editH = d.dataset.oh; renderAdminLists(); $("#a-edit").scrollIntoView({ behavior: "smooth", block: "center" }); });

  const el = $("#a-list"); if (!el) return;

/* ---------- 공통: 게임 참가자 지정 ---------- */
function parseNos(text) {
  const out = new Set();
  String(text || "").split(/[,\s]+/).filter(Boolean).forEach(tok => {
    const m = tok.match(/^(\d+)\s*[-~]\s*(\d+)$/);
    if (m) { let a = +m[1], b = +m[2]; if (a > b) [a, b] = [b, a]; for (let i = a; i <= b && i - a < 500; i++) out.add(i); }

}

/* 지정한 사람(없으면 접속자 전체). needOnline이면 접속 중인 사람만, 빠진 번호는 알려줌 */

    const o = online.find(p => p.no === no);

function nunchiCalc(st, presses) {

/* 깜빡이: 아직 살아있는 사람이 나가면 다음 탈락 그룹으로 옮김 (우승자가 나가면 새 우승자) */
async function blinkLeftDrive(st) {
  if (S.bkBusy) return;
  const f = blinkState(st, B.now()); if (f.phase === "done" || f.phase === "wait") return;
  const cur = f.r; if (cur >= st.rounds.length) return;
  const outSoFar = new Set(); for (let i = 0; i < cur; i++) st.rounds[i].forEach(n => outSoFar.add(n));
  const remaining = st.players.map(p => p.no).filter(n => !outSoFar.has(n) && !(st.left || []).includes(n));
  const gone = goneNos("bk" + st.id, remaining); if (!gone.length) return;
  let rounds = st.rounds.map(r => r.slice()), winner = st.winner; const moved = [];
  for (const n of gone) {
    if (n === winner) {
      const last = rounds.length - 1, cand = rounds[last].filter(x => !gone.includes(x));
      if (!cand.length) continue;
      winner = cand[cand.length - 1]; rounds[last] = rounds[last].filter(x => x !== winner);
      if (!rounds[cur].includes(n)) rounds[cur].push(n); moved.push(n);
    } else {
      const j = rounds.findIndex(r => r.includes(n));
      if (j > cur) { rounds[j] = rounds[j].filter(x => x !== n); rounds[cur].push(n); }
      moved.push(n);
    }
  }
  if (!moved.length) return;

    await B.update("stage", { rounds, winner, left: (st.left || []).concat(moved), leftMsg: { nos: moved, at: B.now() } });
    if (st.prize && winner !== st.winner) { const w = st.players.find(p => p.no === winner); await B.update("history", { [st.id + "_w"]: { game: "blink", prize: st.prize, no: w.no, name: w.name, ts: st.startAt + rounds.length * st.per + (rounds.length - 1) * (st.gap || 0) } }); }
  } finally { setTimeout(() => S.bkBusy = false, 300); }
}

/* ---------- 랜덤 자리 배치 ---------- */
const SEAT_SHUFFLE = 2800;
function seatRows(st) { return Math.ceil(st.seats.length / 2); }
function seatLabel(st, i) { const R = seatRows(st); return i < R ? `왼쪽 ${i + 1}번째` : `오른쪽 ${i - R + 1}번째`; }
function seatNear(st, i) {
  const R = seatRows(st), col = i < R ? 0 : 1, r = i - col * R;
  const opp = col ? r : R + r, side = [r - 1, r + 1].filter(x => x >= 0 && x < R).map(x => col * R + x);
  return { opp, side };
}
function buildSeat(st) {
  const R = seatRows(st), cell = i => `<div class="seat" data-i="${i}"><small>${i < R ? "L" : "R"}${(i % R) + 1}</small><b>?</b><span></span></div>`;
  let rows = "";
  for (let r = 0; r < R; r++) rows += `<div class="srow">${cell(r)}<div class="stable">${r === 0 ? "" : ""}</div>${cell(R + r)}</div>`;
  return `<div class="draw">
    <div class="prize-label">🪑 랜덤 자리 배치</div>
    <div class="status" id="ststatus" style="font-weight:800;font-size:17px;color:var(--fire)"></div>
    <div id="mewin"></div>
    <div class="seatwrap">
      <div class="seat-end">▲ ${esc(st.head || "앞쪽")}</div>
      <div class="seatgrid">${rows}</div>
      <div class="seat-end">▼ ${esc(st.tail || "뒤쪽")}</div>
    </div>
    <p class="muted" style="font-size:12px;margin-top:8px">왼쪽(L)과 오른쪽(R) 자리는 테이블을 사이에 두고 서로 마주 봐요</p>
  </div>`;
}
function updateSeat(st) {
  const now = B.now(), t = now - st.startAt, per = st.per || 250, total = st.seats.length;
  const myNo = S.rosterMe && S.rosterMe.no, people = {}; (st.plist || []).forEach(p => people[p.no] = p.name);
  const pool = (st.plist || []).map(p => p.no);
  if (!S.drawState.seatRev) { const m = {}; (st.order || []).forEach((i, k) => m[i] = k); S.drawState.seatRev = m; }
  const rev = S.drawState.seatRev;
  let shown = 0;
  $$(".seat").forEach(el => {
    const i = +el.dataset.i, no = st.seats[i], at = SEAT_SHUFFLE + (rev[i] ?? 0) * per;
    let txt, nm = "", cls;
    if (t < 0) { txt = "?"; cls = "wait"; }
    else if (t < at) { const fake = pool.length ? pool[(Math.floor(t / 90) + i * 7) % pool.length] : 0; txt = "#" + fake; cls = "spin"; }
    else { shown++; cls = no ? "set" : "set empty"; txt = no ? "#" + no : "빈자리"; nm = no ? (people[no] || "") : ""; if (no && no === myNo) cls += " me"; }
    const sig = cls + txt + nm;
    if (el.dataset.sig !== sig) { el.dataset.sig = sig; el.className = "seat " + cls; el.querySelector("b").textContent = txt; el.querySelector("span").textContent = nm; }
  });
  const s = $("#ststatus"), done = t >= SEAT_SHUFFLE + (total - 1) * per;
  const msg = t < 0 ? `⏳ ${Math.ceil(-t / 1000)}초 뒤 자리 배치 시작!` : t < SEAT_SHUFFLE ? "🎲 자리 섞는 중…" : !done ? `🪑 자리 공개 중… ${shown}/${total}` : `✅ 자리 배치 완료! (${pool.length}명)`;
  if (s && s.textContent !== msg) s.textContent = msg;
  const mi = myNo != null ? st.seats.indexOf(myNo) : -1;
  if (mi >= 0 && t >= SEAT_SHUFFLE + (rev[mi] ?? 0) * per) {
    const mw = $("#mewin");
    if (mw && !mw.dataset.done) {
      mw.dataset.done = "1";
      const nb = seatNear(st, mi), op = st.seats[nb.opp], sd = nb.side.map(x => st.seats[x]).filter(Boolean);
      // people map is built above
      mw.innerHTML = `<div class="mewin seatme">🎉 내 자리는 <b>${seatLabel(st, mi)}</b> 자리예요!<div class="seatnb">${op ? `👀 맞은편: <b>#${op} ${esc(people[op] || "")}</b>` : "👀 맞은편: 빈자리"}${sd.length ? `<br>🤝 옆자리: ${sd.map(n => `<b>#${n} ${esc(people[n] || "")}</b>`).join(", ")}` : ""}</div></div>`;
      confetti(140); navigator.vibrate && navigator.vibrate([100, 50, 160]);
      const me = $(`.seat[data-i="${mi}"]`); if (me) setTimeout(() => me.scrollIntoView({ behavior: "smooth", block: "center" }), 600);
    }
  }
  if (done && !S.fired.has("seat" + st.id)) { S.fired.add("seat" + st.id); if (mi < 0) confetti(70); }
}
async function seatStart() {
  const players = gamePlayers(false);
  if (players.length < 2) return toast("참가자가 2명 이상이어야 해요");
  const rows = Math.ceil(players.length / 2), seats = shuffle(players.map(p => p.no));
  while (seats.length < rows * 2) seats.splice(rnd(seats.length + 1), 0, 0); // 홀수면 빈자리 하나
  const plist = players.map(p => ({ no: p.no, name: p.name }));
  const order = shuffle([...Array(seats.length).keys()]);
  if (!confirm(`${players.length}명 자리를 배치할까요? (한쪽 ${rows}자리씩)`)) return;
  await B.set("stage", { type: "seat", id: newId(), seats, plist, order, per: parseInt($("#st-speed").value) || 250, head: $("#st-head").value.trim() || "앞쪽", tail: $("#st-tail").value.trim() || "뒤쪽", startAt: B.now() + 3000 });
  setTab("stage");
}

      const btns = st.phase === "q" ? `${canNext ? `<button class="btn ghost" data-qa="hint">${Z.nextLv}</button>` : ""}<button class="btn fire" data-qa="ans">✅ 정답 공개</button>`
        : st.phase === "ans" ? `<button class="btn ghost" data-qa="board">📊 순위 보기</button><button class="btn fire" data-qa="${last ? "done" : "next"}">${last ? "🏆 최종 결과" : "➡️ 다음 문제"}</button>`
        : st.phase === "board" ? `<button class="btn fire" data-qa="${last ? "done" : "next"}">${last ? "🏆 최종 결과" : "➡️ 다음 문제"}</button>`
        : `<button class="btn ghost" data-qa="end">대기 화면으로</button>`;
      const sig = st.phase + st.turn + ":" + lv;
      if (c.dataset.sig !== sig) { c.dataset.sig = sig; c.innerHTML = `<div class="row" style="justify-content:center">${btns}</div>${st.phase !== "done" ? `<div class="row" style="justify-content:center;margin-top:8px"><button class="btn ghost sm" data-qa="skip">⏭ 이 문제 건너뛰기</button><button class="btn ghost sm" data-qa="done">퀴즈 끝내기</button></div>` : ""}`; c.querySelectorAll("[data-qa]").forEach(b => b.onclick = () => quizAction(b.dataset.qa)); }
    }
    const cnt = $("#qzcnt");
    if (cnt && q) { const v = Object.values(((S.sd || {}).a || {})[st.qk] || {}).filter(x => quizCorrect(st, q, x.text)).length; if (cnt.textContent !== String(v)) cnt.textContent = v; }
  } else if (q && st.phase === "q") {
    const box = $("#qzme"); if (!box) return;
    const d = S.sd || {}, ok = d.text && quizCorrect(st, q, d.text), tries = d.tries || 0, left = Z.tries - tries;
    let html;
    if (!canPlay(st)) html = `<div class="card muted">이번 퀴즈는 구경해요 👀</div>`;
    else if (ok) html = `<div class="mewin">🎉 정답! “${esc(d.text)}” · 점수는 정답 공개 때 확정돼요</div>`;
    else if (left <= 0) html = `<div class="mewin" style="background:#f1ede4;border-color:#cfc6b3">${tries ? `❌ “${esc(d.text)}” 땡! · ` : ""}${Z.tries === 1 ? "이 문제는 기회 끝!" : "기회를 다 썼어요"} 정답 공개를 기다려요</div>`;
    else html = `<form class="lrform" id="qzform"><input id="qzin" maxlength="40" autocomplete="off" placeholder="${Z.ask}"><button>정답!</button></form>
      <div class="muted" style="font-size:12.5px">${tries ? `❌ “${esc(d.text)}” 땡! · ` : ""}${Z.tries === 1 ? "⚠️ 기회는 한 번! 틀리면 이 문제는 끝" : `남은 기회 ${left}번`}</div>`;
    const sig = (ok ? "ok" : "") + tries + (canPlay(st) ? "" : "x");
    if (box.dataset.sig !== sig) {
      box.dataset.sig = sig; box.innerHTML = html;
      if (ok && !S.fired.has("qz" + st.id + st.turn)) { S.fired.add("qz" + st.id + st.turn); confetti(90); navigator.vibrate && navigator.vibrate(120); }
      const f = $("#qzform");
      if (f) f.onsubmit = async e => {
        e.preventDefault(); const v = $("#qzin").value.trim(); if (!v || S.qzSending) return;
        S.qzSending = true;
        try { await B.set(`quiz/${st.id}/a/${st.qk}/${S.me.uid}`, { no: S.rosterMe.no, text: v, tries: tries + 1, t: B.serverTs() }); }
        catch (er) { toast("제출 실패: 이미 정답이 공개됐어요"); }
        S.qzSending = false;
      };
    }
  } else if (st.phase === "ans" && !S.me.isAdmin) {
    const res = (st.qres || {})["q" + st.turn] || [], mine = res.find(r => r.no === (S.rosterMe && S.rosterMe.no));
    if (mine && !S.fired.has("qza" + st.id + st.turn)) { S.fired.add("qza" + st.id + st.turn); toast(`🎉 +${mine.pts}점!`); }
  }
  // 단계(힌트/단서)가 바뀌면 문제 본문만 다시 그림
  const bodySig = st.turn + ":" + lv + st.phase;
  const dr = $("#stage .draw");
  if (st.phase === "q" && dr && dr.dataset.lv !== bodySig) {
    if (dr.dataset.lv !== undefined) { S.stageKey = ""; dr.dataset.lv = bodySig; return renderStage(); }
    dr.dataset.lv = bodySig;
  }
  if (st.phase === "done" && !S.fired.has("qzd" + st.id)) { S.fired.add("qzd" + st.id); const sc = quizScores(st); confetti(sc[0] && S.rosterMe && sc[0].no === S.rosterMe.no ? 260 : 100); }
  const stt = $("#qzstatus");
  if (stt) {
    const last = st.turn >= Z.qs.length - 1;
    const hl = st.hintSec && st.lvStartAt && lv < Z.levels ? Math.max(0, Math.ceil((st.lvStartAt + st.hintSec * 1000 - B.now()) / 1000)) : 0;
    const nextName = st.set === "who" ? "다음 단서" : st.set === "photo" ? "초성" : "힌트";
    const t = st.phase === "q" ? `${st.need || 3}명 맞히면 정답 공개${hl ? ` · 💡 ${hl}초 뒤 ${nextName}` : ""}${lv > 1 ? ` · 지금 맞히면 ${Z.pts[lv - 1]}점` : ""}`
      : st.phase === "ans" && st.nextAt ? `⏱️ ${Math.max(0, Math.ceil((st.nextAt - B.now()) / 1000))}초 뒤 ${last ? "최종 결과 발표" : "다음 문제"}!` : "";
    if (stt.textContent !== t) { stt.textContent = t; stt.style.color = st.phase === "ans" ? "var(--fire)" : ""; stt.style.fontSize = st.phase === "ans" ? "17px" : ""; }
  }
}
async function quizStart() {
  const set = $("#qz-set").value || "movie", Z = QZ[set];
  const from = Math.min(Z.qs.length - 1, Math.max(0, (parseInt($("#qz-from").value) || 1) - 1));
  await B.set("stage", { type: "quiz", set, id: newId(), turn: from, qk: "q" + from, phase: "q", lv: 1, lvStartAt: B.now(), prize: $("#qz-prize").value.trim(), need: Math.max(1, parseInt($("#qz-need").value) || 3), hintSec: Math.max(0, parseInt($("#qz-hint").value) || 0), allow: allowOf(), lvAt: {}, qres: {} });
  setTab("stage");
}
/* 운영진 화면: N명 맞히면 자동 정답 공개 → 5초 뒤 다음 문제 / 시간 지나면 힌트·단서 자동 공개 */
function quizDrive(st) {
  if (S.qzBusy) return;
  const Z = qzOf(st);
  if (st.phase === "q") {
    const q = Z.qs[st.turn]; if (!q) return;
    const cnt = Object.values(((S.sd || {}).a || {})[st.qk] || {}).filter(x => x && quizCorrect(st, q, x.text)).length;
    const elig = st.allow ? onlinePlayers().filter(p => st.allow.includes(p.no)).length : onlinePlayers().length;
    const need = Math.max(1, Math.min(st.need || 3, elig || 1));
    if (cnt >= need) quizAction("ans", true);
    else if (st.hintSec && qLv(st) < Z.levels && st.lvStartAt && B.now() > st.lvStartAt + st.hintSec * 1000) quizAction("hint");
  } else if (st.phase === "ans" && st.nextAt && B.now() > st.nextAt) quizAction(st.turn >= Z.qs.length - 1 ? "done-auto" : "next");
}
function quizScoreQ(st, ans) {
  const Z = qzOf(st), q = Z.qs[st.turn], lvAt = ((st.lvAt || {})["q" + st.turn]) || [];
  const ok = Object.values(ans).filter(x => x && x.no != null && quizCorrect(st, q, x.text)).sort((x, y) => x.t - y.t);
  return ok.map((x, i) => { const lv = 1 + lvAt.filter(t => t && x.t >= t).length; return { no: x.no, pts: Z.pts[Math.min(lv, Z.pts.length) - 1] + (i === 0 ? Z.bonus : 0) }; });
}
async function quizAction(a, auto) {
  const st = S.stage; if (!st || st.type !== "quiz" || S.qzBusy) return;
  const Z = qzOf(st);
  S.qzBusy = true;
  try {
    if (a === "hint") {
      const lv = qLv(st); if (lv >= Z.levels || st.phase !== "q") return;
      const arr = (((st.lvAt || {})["q" + st.turn]) || []).slice(); arr[lv - 1] = B.now();
      await B.update("stage", { lv: lv + 1, lvStartAt: B.now(), ["lvAt/q" + st.turn]: arr });
    }
    else if (a === "ans") {
      const ans = (((await B.get("quiz/" + st.id)) || {}).a || {})[st.qk] || {};
      await B.update("stage", { phase: "ans", ["qres/q" + st.turn]: quizScoreQ(st, ans), nextAt: auto ? B.now() + 5000 : null });
    }
    else if (a === "board") await B.update("stage", { phase: "board" });
    else if (a === "next" || a === "skip") {
      const n = st.turn + 1;
      if (n >= Z.qs.length) return quizFinish(st);
      await B.update("stage", { phase: "q", turn: n, qk: "q" + n, lv: 1, lvStartAt: B.now(), nextAt: null });
    }
    else if (a === "done") { if (st.phase === "done" || confirm("퀴즈를 끝내고 최종 결과를 발표할까요?")) await quizFinish(st); }
    else if (a === "done-auto") await quizFinish(st);
    else if (a === "end") await B.set("stage", { type: "idle", id: newId(), msg: "곧 다음 게임이 시작돼요!" });
  } finally { setTimeout(() => S.qzBusy = false, 300); }
}
async function quizFinish(st) {
  if (st.phase === "q") { // 정답 공개 전에 끝내면 지금 문제도 채점
    const ans = (((await B.get("quiz/" + st.id)) || {}).a || {})[st.qk] || {}, res = quizScoreQ(st, ans);
    st = { ...st, qres: { ...(st.qres || {}), ["q" + st.turn]: res } };
    await B.update("stage", { ["qres/q" + st.turn]: res });
  }
  await B.update("stage", { phase: "done" });
  const top = quizScores(st)[0];
  if (st.prize && top) await B.update("history", { [st.id + "_w"]: { game: "quiz", prize: st.prize, no: top.no, name: nameOfNo(top.no), ts: B.now() } });
}

/* ---------- 꽃가루 ---------- */
function confetti(n) {
  const cv = $("#confetti"), cx = cv.getContext("2d");
  cv.width = innerWidth * devicePixelRatio; cv.height = innerHeight * devicePixelRatio; cx.scale(devicePixelRatio, devicePixelRatio);
  const cols = ["#e8743b", "#f3a35b", "#d9a52b", "#4f6b4a", "#c1272d", "#3d6fb6", "#fff"];
  const ps = Array.from({ length: n }, () => ({ x: innerWidth / 2 + (Math.random() - .5) * 80, y: innerHeight * .38, vx: (Math.random() - .5) * 14, vy: -Math.random() * 15 - 4, r: Math.random() * 6 + 4, c: cols[rnd(cols.length)], a: Math.random() * 6, va: (Math.random() - .5) * .4 }));
  let f = 0;
  (function step() {
    cx.clearRect(0, 0, innerWidth, innerHeight);
    for (const p of ps) { p.vy += .42; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.a += p.va; cx.save(); cx.translate(p.x, p.y); cx.rotate(p.a); cx.fillStyle = p.c; cx.fillRect(-p.r / 2, -p.r / 4, p.r, p.r / 2); cx.restore(); }
    if (++f < 150) requestAnimationFrame(step); else cx.clearRect(0, 0, innerWidth, innerHeight);
  })();
}
